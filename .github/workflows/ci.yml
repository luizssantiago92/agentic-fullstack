name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

  test:
    runs-on: ubuntu-latest
    needs: lint-workflows
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (links local CLI bin for npx in this repo)
        run: npm install

      - name: Verify npx resolves local package CLI
        if: matrix.node-version == 22
        run: |
          npx @luizsantiago/fullstack-floor-map --version
          test -x node_modules/.bin/fullstack-floor-map

      - name: Run tests
        run: npm test

      - name: Verify packaged skills exist
        run: |
          test -f skills/frontend-engineering.md
          test -f skills/backend-engineering.md
          test -f skills/data-engineering.md
          test -f skills/analytics-engineering.md
          test -f skills/data-science-engineering.md
          test -f rules/fullstack-layer.mdc
          test -f templates/PROJECT.md
          test -f gates/validate_layer_routing.py
          test -f NOTICE
          test -d catalog/react-expert
          test -f catalog/react-expert/SKILL.md

      - name: Validate layer skills + catalog structure
        run: node scripts/validate-layer-skills.mjs

      - name: Verify npm pack contents
        run: |
          npm pack --dry-run 2>&1 | grep -q "frontend-engineering.md"
          npm pack --dry-run 2>&1 | grep -q "data-engineering.md"
          npm pack --dry-run 2>&1 | grep -q "gates/validate_layer_routing.py"
          npm pack --dry-run 2>&1 | grep -q "scripts/link-local-bin.mjs"
          npm pack --dry-run 2>&1 | grep -q "catalog/react-expert/SKILL.md"
          npm pack --dry-run 2>&1 | grep -q "NOTICE"
          if npm pack --dry-run 2>&1 | grep -E 'demo-login/'; then
            echo "demo-login must not ship in the npm package" >&2
            exit 1
          fi
          if npm pack --dry-run 2>&1 | grep -E 'test/'; then
            echo "test/ must not ship in the npm package" >&2
            exit 1
          fi
          if npm pack --dry-run 2>&1 | grep -E 'examples/'; then
            echo "examples/ must not ship in the npm package" >&2
            exit 1
          fi
          if npm pack --dry-run 2>&1 | grep -E 'wiki/'; then
            echo "wiki/ must not ship in the npm package" >&2
            exit 1
          fi
          mkdir -p gates/__pycache__
          echo 'bytecode' > gates/__pycache__/validate_layer_routing.cpython-312.pyc
          if npm pack --dry-run 2>&1 | grep -E '__pycache__|\.pyc'; then
            echo "__pycache__ or *.pyc must not ship in the npm package" >&2
            exit 1
          fi
          rm -rf gates/__pycache__

      - name: Demo layer routing gate
        if: matrix.node-version == 22
        run: |
          npx --yes @luizsantiago/spec-seatbelt@2 install
          node index.js install
          npm run demo:validate
          test -f .specs/seatbelt/scripts/validate_layer_routing.py
          test -f .specs/seatbelt/scripts/validate_spec.py
