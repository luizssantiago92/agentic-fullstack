name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump, or none to publish the current package.json version"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - patch
          - minor
          - major

concurrency:
  group: npm-publish-agentic-fullstack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require main for manual publish
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publish must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate release tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Release tag v$TAG matches package.json $PKG"

      - name: Run tests
        run: |
          npm install
          npm test

      - name: Configure git
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          npm version "$VERSION_BUMP" -m "chore(release): %s"

      - name: Check if version already published
        id: npm_check
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if npm view @luizsantiago/agentic-fullstack@"$VERSION" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already on npm — skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not on npm yet"
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version bump commit
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: git push origin main --follow-tags

      - name: Ensure version tag exists (publish current version)
        if: github.event_name == 'workflow_dispatch' && inputs.bump == 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on origin"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
          fi
