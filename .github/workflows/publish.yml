name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump, or none to publish the current package.json version"
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require main for manual publish
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publish must run from main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Run tests
        run: npm test

      - name: Configure git
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: npm version "$VERSION_BUMP" -m "chore(release): %s"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version tag (manual dispatch with bump)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: git push origin main --follow-tags
